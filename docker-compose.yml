services:
  # Setup for development
  webapp:
    build:
      context: .
      dockerfile: .dockerfile
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION}
    container_name: ${CONTAINER_PREFIX}-web-dev
    restart: unless-stopped
    ports:
      - "${PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=${TZ}
      # Database Configuration
      - Database__ConnectionString=${DATABASE_CONNECTION_STRING}
      # Application Configuration
      - Application__Name=${Application__Name}
      - Application__Version=${Application__Version}
      - Application__DefaultLanguage=${Application__DefaultLanguage}
      - Application__SupportedLanguages__0=${Application__SupportedLanguages__0}
      - Application__SupportedLanguages__1=${Application__SupportedLanguages__1}
      - Application__BaseUrl=${Application__BaseUrl}
    networks:
      - app-network
    volumes:
      - app-logs:/app/logs
      - uploads-dev:/app/wwwroot/uploads
    deploy:
      resources:
        limits:
          cpus: ${CPU_LIMIT}
          memory: ${MEMORY_LIMIT}
        reservations:
          cpus: ${CPU_RESERVATION}
          memory: ${MEMORY_RESERVATION}
    # Espera a que MySQL esté healthy antes de iniciar la app.
    # Sin esto, la app crashea al intentar conectarse durante ServerVersion.AutoDetect.
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - development

  # Setup for production
  webapp-prod:
    build:
      context: .
      dockerfile: .dockerfile
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION}
    container_name: ${CONTAINER_PREFIX}-web-prod
    restart: unless-stopped
    ports:
      - "${PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=${TZ}
      # Database Configuration
      - Database__ConnectionString=${DATABASE_CONNECTION_STRING}
      # Application Configuration
      - Application__Name=${Application__Name}
      - Application__Version=${Application__Version}
      - Application__DefaultLanguage=${Application__DefaultLanguage}
      - Application__SupportedLanguages__0=${Application__SupportedLanguages__0}
      - Application__SupportedLanguages__1=${Application__SupportedLanguages__1}
      - Application__BaseUrl=${Application__BaseUrl}
    networks:
      - app-network
    volumes:
      - app-logs-prod:/app/logs
      - uploads-prod:/app/wwwroot/uploads
    deploy:
      resources:
        limits:
          cpus: ${CPU_LIMIT}
          memory: ${MEMORY_LIMIT}
        reservations:
          cpus: ${CPU_RESERVATION}
          memory: ${MEMORY_RESERVATION}
    # Espera a que MySQL esté healthy antes de iniciar la app.
    # Sin esto, la app crashea al intentar conectarse durante ServerVersion.AutoDetect.
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - production

  # Base de datos para desarrollo y producción (cuando no se usa BD externa).
  # MySQL no está expuesto al host — solo accesible dentro de app-network.
  db:
    build:
      context: .
      dockerfile: .dockerfile.mysql
    container_name: ${CONTAINER_PREFIX}-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    # Puerto NO expuesto intencionalmente — MySQL solo es accesible dentro de app-network.
    # Descomentar solo para debugging local temporal.
    #ports:
    #  - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        # Subnet fija dentro de 172.17.0.0/16 para compatibilidad con CSF Firewall
        # en el VPS de Neubox (DOCKER_NETWORK4 = "172.17.0.0/16" en /etc/csf/csf.conf).
        #
        # REQUISITO EN EL SERVIDOR — /etc/docker/daemon.json debe contener:
        #   {
        #     "bip": "172.26.0.1/16",
        #       <- mueve docker0 fuera de 172.17.x.x para liberar ese rango
        #     "default-address-pools": [{"base": "172.17.0.0/16", "size": 24}],
        #       <- user-defined networks usan subnets /24 dentro de 172.17.0.0/16
        #     "userland-proxy": false
        #       <- requerido para que el tráfico use iptables directamente;
        #          sin esto, CSF bloquea docker-proxy en la cadena OUTPUT
        #   }
        # Si se omite esta config, la app devuelve 502 Bad Gateway detrás de nginx.
        - subnet: 172.17.100.0/24
          gateway: 172.17.100.1

volumes:
  mysql-data:
    name: ${CONTAINER_PREFIX}-mysql-data
  app-logs:
    name: ${CONTAINER_PREFIX}-logs-dev
  app-logs-prod:
    name: ${CONTAINER_PREFIX}-logs-prod
  uploads-dev:
    name: ${CONTAINER_PREFIX}-uploads-dev
  uploads-prod:
    name: ${CONTAINER_PREFIX}-uploads-prod