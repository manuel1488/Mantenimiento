name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Tests (including Testcontainers)
  # ubuntu-latest has Docker pre-installed
  # ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore App.sln

      - name: Build
        run: dotnet build App.sln --no-restore --configuration Release

      - name: Test (all tests, including Testcontainers)
        run: |
          dotnet test tests/App.Services.Tests/App.Services.Tests.csproj \
            --no-restore \
            --configuration Release \
            --logger "console;verbosity=normal"

  # ─────────────────────────────────────────────
  # Job 2: Build image and push to GHCR
  # Runs on push to main only (not on PRs)
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────
  # Job 3: Deploy to VPS via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Login to GHCR from the VPS
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Go to project directory
            cd ${{ secrets.VPS_PROJECT_PATH }}

            # Pull new image
            docker compose --profile production --env-file .env.production --env-file .env.production.secrets pull webapp-prod

            # Restart with zero-downtime
            docker compose --profile production --env-file .env.production --env-file .env.production.secrets up -d --no-deps webapp-prod

            # Remove old images
            docker image prune -f
